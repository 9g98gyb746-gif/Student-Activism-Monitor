name: GDELT student activism monitor

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new GDELT hits
        run: python scripts/fetch_gdelt.py

      - name: Triage relevance with Claude (optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/classify_relevance.py

      - name: Build dashboard data
        run: python scripts/build_site_data.py

      - name: Commit and push updates
        run: |
          git config user.name "gdelt-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hits.csv docs/data.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update GDELT hits ($(date -u +%F))"
          git push
