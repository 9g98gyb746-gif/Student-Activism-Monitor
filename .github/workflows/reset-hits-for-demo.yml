name: One-time reset hits.csv for demo

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Archive old data and reset hits.csv
        run: python -u scripts/reset_hits_for_demo.py

      - name: Rebuild dashboard data
        run: python -u scripts/build_site_data.py

      - name: Commit and push
        run: |
          git config user.name "gdelt-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hits.csv data/hits_archive_pre_ngrams_*.csv docs/data.json
          git commit -m "One-time: archive pre-ngrams data, reset dashboard to clean slate"
          git pull --rebase origin main
          git push
