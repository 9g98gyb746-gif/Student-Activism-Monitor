# Search terms for the GDELT student-activism monitor.
#
# IMPORTANT ARCHITECTURE NOTE: GDELT's DOC API appears to reject/throttle
# complex boolean queries (many OR'd terms combined) far more aggressively
# than simple ones, regardless of request timing — confirmed by testing a
# single-phrase query (worked instantly) against a 12-clause OR'd query
# (blocked immediately), and consistent with other developers' reports
# that GDELT "does not parse compound boolean expressions reliably."
#
# So instead of one query per category (each OR-ing many synonyms), the
# fetch script runs ONE SIMPLE QUERY PER INDIVIDUAL TERM: just
# ("student" OR "students") AND <term> — at most 3 total clauses, no
# nested OR-of-OR. This means more requests (~47 instead of 7), but each
# one is about as simple as a query gets, which should be far more
# reliable than fewer, more complex ones.

identity_terms: '("student" OR "students")'

categories:
  - id: physical_violence
    label: "Physical violence & killings"
    terms: [beaten, assaulted, "tear gas", shot, killed, murdered, disappeared, tortured]

  - id: detention_arrest
    label: "Arrests & detention"
    terms: [arrested, detained, jailed, imprisoned, "held in custody", "taken into custody"]

  - id: legal_harassment
    label: "Legal harassment & lawfare"
    terms: [charged, prosecuted, indicted, lawsuit, "criminal case", sedition, "anti-terrorism law", criminalized]

  - id: institutional_sanction
    label: "Institutional & academic sanctions"
    terms: [expelled, suspended, "denied degree", "disciplinary action", "banned from campus", "withheld diploma"]

  - id: surveillance_intimidation
    label: "Surveillance, threats & intimidation"
    terms: [surveillance, intimidated, threatened, harassed, monitored, stalked, "death threat"]

  - id: delegitimization
    label: "Delegitimization & smear campaigns"
    terms: ["foreign agent", "linked to terrorism", discredited, "smear campaign", "national security threat", "enemy of the state"]

  - id: visa_immigration
    label: "Visa & immigration retaliation"
    terms: [deported, "visa revoked", "visa cancelled", "visa canceled", denationalized, "denied re-entry"]

# Used to flag rows in the dashboard based on whether the country is
# mentioned in the article's headline — a proxy for where the incident
# happened, since GDELT's free API doesn't expose true event-location
# tagging. Does NOT restrict the search; it's a highlighting aid only.
watchlist_countries:
  - name: Afghanistan
    aliases: []
  - name: Bolivia
    aliases: []
  - name: Colombia
    aliases: []
  - name: Myanmar
    aliases: ["Burma"]
  - name: Norway
    aliases: []
  - name: Palestine
    aliases: ["Gaza", "West Bank", "Palestinian"]
  - name: South Africa
    aliases: []
  - name: Zambia
    aliases: []
  - name: Zimbabwe
    aliases: []

# Used as a local relevance filter after fetching: a headline must contain
# the bare word "student(s)" (broad, for reliability against GDELT) AND at
# least one of these activism-context words to be flagged as a likely
# match. Rows that don't match aren't discarded — just hidden by default
# in the dashboard — since a genuinely relevant but oddly-worded headline
# shouldn't be lost outright.
context_terms:
  - activist
  - activism
  - protest
  - demonstrat
  - rally
  - union
  - campus
  - movement
  - walkout
  - boycott
  - dissident
  - "sit-in"
