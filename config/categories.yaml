# Search terms for the GDELT student-activism monitor.
#
# ARCHITECTURE NOTE: this config is used by scripts/fetch_ngrams.py, which
# scans GDELT's Web NGrams dataset locally rather than querying GDELT's
# search API. That API has been persistently unreliable (GDELT's own
# maintainer confirmed their search infrastructure is mid-migration and
# temporarily can't handle normal load) — the ngrams approach sidesteps
# this entirely, since it only ever downloads small static files, never
# sends GDELT a query to reject or rate-limit.
#
# One consequence: there's no query-complexity limit to work around
# anymore, so identity_phrases can (and should) be activism-specific
# rather than the bare "student"/"students" the old DOC-API version had
# to use for reliability. A real-data check found bare "student" produced
# 80-100% noise per search term — this tighter list fixes that at the
# source instead of relying entirely on the noise filter afterward.
identity_phrases:
  - "student activist"
  - "student protester"
  - "student protesters"
  - "student union"
  - "students union"
  - "campus protest"
  - "student demonstrators"
  - "student movement"

categories:
  - id: physical_violence
    label: "Physical violence & killings"
    terms: [beaten, assaulted, "tear gas", shot, killed, murdered, disappeared, tortured]

  - id: detention_arrest
    label: "Arrests & detention"
    terms: [arrested, detained, jailed, imprisoned, "held in custody", "taken into custody"]

  - id: legal_harassment
    label: "Legal harassment & lawfare"
    terms: [charged, prosecuted, indicted, lawsuit, "criminal case", sedition, "anti-terrorism law", criminalized]

  - id: institutional_sanction
    label: "Institutional & academic sanctions"
    terms: [expelled, suspended, "denied degree", "disciplinary action", "banned from campus", "withheld diploma"]

  - id: surveillance_intimidation
    label: "Surveillance, threats & intimidation"
    terms: [surveillance, intimidated, threatened, harassed, monitored, stalked, "death threat"]

  - id: delegitimization
    label: "Delegitimization & smear campaigns"
    terms: ["foreign agent", "linked to terrorism", discredited, "smear campaign", "national security threat", "enemy of the state"]

  - id: visa_immigration
    label: "Visa & immigration retaliation"
    terms: [deported, "visa revoked", "visa cancelled", "visa canceled", denationalized, "denied re-entry"]

# Used to flag rows in the dashboard based on whether a focus country is
# mentioned anywhere in the article's FULL TEXT (an upgrade from the old
# headline-only check, since this dataset covers whole articles). Does
# NOT restrict the search; it's a highlighting aid only.
focus_countries:
  - name: Afghanistan
    aliases: []
  - name: Bolivia
    aliases: []
  - name: Colombia
    aliases: []
  - name: Myanmar
    aliases: ["Burma"]
  - name: Norway
    aliases: []
  - name: Palestine
    aliases: ["Gaza", "West Bank", "Palestinian"]
  - name: South Africa
    aliases: []
  - name: Zambia
    aliases: []
  - name: Zimbabwe
    aliases: []
  - name: Honduras
    aliases: []
  - name: United Kingdom
    aliases: ["UK", "Britain"]
  - name: Ghana
    aliases: []
  - name: Morocco
    aliases: []
  - name: Brazil
    aliases: []
  - name: Turkey
    aliases: ["Türkiye"]
  - name: Chile
    aliases: []
  - name: Nicaragua
    aliases: []
  - name: Russia
    aliases: []
  - name: Indonesia
    aliases: []

# Local relevance filter: full article text must contain an
# activism-context word for context_match to be "yes". Non-matches are
# hidden by default in the dashboard, not discarded.
context_terms:
  - activist
  - activism
  - protest
  - demonstration
  - demonstrator
  - rally
  - "student union"
  - "students union"
  - movement
  - walkout
  - boycott
  - dissident
  - "sit-in"
