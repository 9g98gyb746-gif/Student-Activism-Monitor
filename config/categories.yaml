# Search terms for the GDELT student-activism monitor.
#
# Used by scripts/fetch_ngrams.py, which scans GDELT's Web NGrams dataset
# locally (no queries are sent to GDELT's search API).
#
# HOW MATCHING WORKS
#   - A story is recorded when its text contains at least one identity
#     phrase AND at least one category term.
#   - Identity phrases and category terms match from the START of a word
#     (so "student activist" also matches "student activists", and
#     "killed" no longer matches inside "skilled").
#   - Countries and the scope lists below match whole words only.
#   - Spaces and hyphens are interchangeable ("tear gas" = "tear-gas").
#   - If a story matches several categories, the one mentioned most wins.

identity_phrases:
  - "student activist"
  - "student protest"        # also matches "student protests" and "student protesters"
  - "student protester"
  - "student protesters"
  - "student union leader"
  - "student union president"
  - "student union protest"
  - "campus protest"
  - "student demonstrators"
  - "student movement"

# PARTNER NAMES: student unions, education campaigns and other education
# partners of SAIH. A story that names one of them counts like an identity
# phrase above (it still needs a repression term, with the same context
# rules). Names match whole words only, in lower or upper case. A name can be
# at most 4 words: GDELT stores text in 4-word pieces, so a longer name is
# written as its first 3-4 distinctive words. Abbreviations that are also
# ordinary words or other organisations are NOT listed (UCAS is the UK
# admissions service, ANDES is a mountain range, SRC is a student council):
# use the full name instead.
# Names in Spanish only work once Spanish repression terms are added.
# No partners are named for Myanmar (security situation).
partner_phrases:
  # Palestine
  - birzeit
  - "right to education campaign"
  - "college of applied sciences"      # University College of Applied Sciences (UCAS), Gaza
  # Zimbabwe
  - zinasu
  - "zimbabwe national students union"
  - ecozi
  - "education coalition of zimbabwe"
  - "college lecturers association"    # COLAZ / COALZ
  - colaz
  - coalz
  - ptuz
  - "progressive teachers union"
  - saywhat
  - "students and youth working"
  - "youth empowerment transformation trust"
  # Zambia
  - zanasu
  - "zambia national students union"
  - zanec
  - "zambia national education coalition"
  # South Africa: see partner_phrases_generic below
  # Colombia (Spanish)
  - "asociación colombiana de estudiantes"
  - "asociacion colombiana de estudiantes"
  - "asociación nacional de estudiantes"
  - "asociacion nacional de estudiantes"
  - "çxhab wala kiwe"
  # Bolivia (Spanish)
  - "funproeib andes"
  # NOT included, to keep the monitor on students and education. Add a line
  # above if SAIH wants them: ZLHR (Zimbabwe Lawyers for Human Rights), GALZ,
  # SRC (Sexual Rights Centre), GALA, GDX (Gender DynamiX), CSA&G, PCN,
  # NOMADESC, CRIC, ADESPROC, CDIMA, Fe y Alegría.

# Partner names that are also ordinary words. They count as an identity
# phrase, but NOT as a student word for the stricter terms ("arrested" ...).
partner_phrases_generic:
  - "equal education"                  # Equal Education, South Africa

categories:
  - id: physical_violence
    label: "Physical violence & killings"
    # "shot" was removed: too ambiguous in everyday English ("shot" a photo,
    # "long shot"). Add it back if you find real misses.
    terms: [beaten, assaulted, "tear gas", killed, murdered, disappeared, tortured]

  - id: detention_arrest
    label: "Arrests & detention"
    terms: [arrested, detained, jailed, imprisoned, "held in custody", "taken into custody"]

  - id: legal_harassment
    label: "Legal harassment & lawfare"
    # "lawsuit" was removed: most hits were institutions vs. government
    # (e.g. Harvard funding), not legal action against student activists.
    terms: [charged, prosecuted, indicted, "criminal case", sedition, "anti-terrorism law", criminalized]

  - id: institutional_sanction
    label: "Institutional & academic sanctions"
    terms: [expelled, suspended, "denied degree", "disciplinary action", "banned from campus", "withheld diploma"]

  - id: surveillance_intimidation
    label: "Surveillance, threats & intimidation"
    terms: [surveillance, intimidated, threatened, harassed, monitored, stalked, "death threat"]

  - id: delegitimization
    label: "Delegitimization & smear campaigns"
    terms: ["foreign agent", "linked to terrorism", discredited, "smear campaign", "national security threat", "enemy of the state"]

  - id: visa_immigration
    label: "Visa & immigration retaliation"
    terms: [deported, "visa revoked", "visa cancelled", "visa canceled", denationalized, "denied re-entry"]

# SECOND SIGNAL: some terms are too ambiguous on their own ("suspended" a
# service, "charged" a battery, "killed" in a war story). The terms listed
# here are only counted when one of the context words appears within
# `distance` words of them. Every term listed must also be a term in a
# category above. Words match from the start ("protest" also matches
# "protesters"). If an article's only repression terms fail this test, it is
# not recorded, and the run log says "skipped (ambiguous term, no context)".
# This applies to new articles only; the cleanup tool checks headlines with
# the generic context words.
second_signal:
  distance: 12
  terms:
    - suspended
    - expelled
    - charged
    - surveillance
    - monitored
    - threatened
    - "disciplinary action"
    - discredited
    - killed
    - arrested
    - detained
    - jailed
    - "tear gas"
    - sedition
  context_words:
    - protest
    - demonstrat
    - activist
    - rally
    - rallies
    - encampment
    - "sit-in"
    - crackdown
    - police
    - "security forces"
    - riot
    - clash
    - unrest
    - uprising
    - arrest
    - detain
    - "tear gas"
    - "stun grenade"
    - "rubber bullet"
    - baton
    - blockade
    - strike
    - dissent
    - violen
    - "pro-palestin"
    - "anti-israel"
    - detention
    - repress
    - spyware
    - pegasus
    - "academic freedom"
    - "university autonomy"
    - academic
  # STRICTER TERMS: these terms (they must also be listed under `terms` above)
  # are only counted when one of the student words below is near, not just any
  # context word. "Suspended" in a riot story (a metro line, a flight) then no
  # longer counts as a student suspension, but "students suspended" or
  # "suspended activists" still does. The same goes for the broad terms
  # "killed", "arrested", "detained" ... which otherwise pick up crime and
  # party-politics stories that merely mention a student somewhere.
  # A partner name (partner_phrases above) also counts as a student word.
  student_context_terms:
    - suspended
    - expelled
    - "disciplinary action"
    - killed
    - threatened
    - arrested
    - detained
    - jailed
    - "tear gas"
    - sedition
  student_context_words:
    - student
    - pupil
    - school
    - universit
    - college
    - campus
    - lecturer
    - professor
    - teacher
    - academic
    - undergraduate
    - faculty
    - vice-chancellor
    - classes
    - classroom
    - activist

# IGNORE PHRASES: a repression term that is part of one of these phrases does
# not count where the phrase occurs, so "sexually assaulted" is not counted as
# "assaulted" (violence by police). Words match from the start, like the terms.
ignore_phrases:
  - "sexually assaulted"
  - "sexually abused"
  - "sexually harassed"
  - "sexual assault"

# SKIP: articles that are never recorded, however well they match.
skip:
  # Whole domains: aggregators, entertainment/trivia sites, sites that
  # re-publish old stories as new.
  domains:
    - lolwot.com
    - libcom.org
    - newsnow.co.uk
    - whmi.com
    - listverse.com
    - onenewspage.com
    - digbycourier.ca
    - blackagendareport.com
  # Titles matching any of these (case-insensitive) are skipped.
  title_patterns:
    - "net worth$"
    - "^morning briefing"
    - "intelligence brief"
    - "live feed"
    - "top [0-9]+ stories"
    - "top news of the day"
    - "news digest"
    - "evening wrap"
    - "^latest from "
    - "^q&a \\|"
    - "best (shows|movies)"
    - "^[a-z]+ [0-9]{1,2}, [0-9]{4}$"
    - "\\. and, "              # newsletter-style headlines: "Story one. And, story two"
    - "^today'?s news"
    - "^(top |daily |weekly )?(news )?(roundup|round-up|headlines|bulletin|digest|newsletter)"
    - "^[a-z]+ 20[0-9]{2} \\|"   # "October 2026 | FlaglerLive"
    - "^(sunday|saturday|monday|tuesday|wednesday|thursday|friday) (morning|evening)"
    - "cocktails?$"
    - "recipes?$"
  # A title with fewer than min_title_words words AND fewer than
  # min_title_chars characters is treated as a generic page title
  # ("Albanian Daily News"). Long titles in scripts without spaces are kept.
  min_title_words: 4
  min_title_chars: 25

# PARTNER COUNTRIES: where SAIH's partners work. A story gets the partner
# badge (and appears under "Partner countries only") when its main country
# is one of these. Each name must also appear in the regions list below.
partner_countries:
  - Bolivia
  - Colombia
  - Nicaragua
  - Zambia
  - South Africa
  - Zimbabwe
  - Eswatini
  - Afghanistan
  - Myanmar
  - Palestine

# REGIONS: every country belongs to exactly one region (these power the
# dashboard's region dropdown). Each entry is  "Name | alias | alias ...".
# The name and every alias are matched as whole words in the headline and
# article text. Notes on judgment calls, all easy to change by moving a line:
#   - Mexico is in Latin America. Turkey, Russia and the Caucasus are in
#     Europe (the Amnesty/HRW convention). Afghanistan is in South Asia.
#     Sudan is in "Rest of Sub-Saharan Africa". Central Asia is grouped
#     with East Asia.
#   - Names such as "Georgia (country)" or "Jordan (country)" are written
#     that way on purpose so the bare word (the US state, a first name) is
#     NOT matched; only the aliases are.
#   - Deliberately left out as aliases because they cause wrong matches:
#     "America/American" (also matches Latin American), "Greek" (US
#     fraternities), "Polish", "Athens", "Oxford", "New York" (New York
#     Times citations), and "Washington". Likewise "Palestinian" alone is not
#     an alias for Palestine (a "Palestinian protest lawsuit" is usually a
#     US court case); "Palestine", "Gaza" and "West Bank" are. Phrases like
#     "pro-Palestinian" and "anti-Israel" are ignored for location purposes.
regions:
  - name: "North America"
    countries:
      - "United States | u.s. | usa | u.s.a. | united states of america | trump | harvard | columbia university | cornell | ucla | yale | stanford | princeton | berkeley | haverford | georgetown | temple university | university of california | california | newsom | mamdani | mahmoud khalil | columbia | chicago | ucsd | usc | yalie | gwu | uc | doj | desantis | temple u | michigan"
      - "Canada | canadian | toronto | montreal | vancouver | ottawa | british columbia"

