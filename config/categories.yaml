# SCOPE TAGS: used by the dashboard's "Hide ..." filters. Each story gets
# zero or more tags, stored in the scope_tags column of data/hits.csv
# (separated by semicolons). To add a new filter later, add a list here
# and a tag in scripts/fetch_ngrams.py; no new column is needed.
scope_terms:
  # A story is tagged "high_school" when school words clearly outnumber
  # university words (see HIGH_SCHOOL_MIN_HITS in fetch_ngrams.py).
  high_school:
    - "high school"
    - "secondary school"
    - "middle school"
    - "school student"
    - "school pupil"
    - schoolchild
    - schoolchildren
    - schoolboy
    - schoolgirl
    - pupil
    - lycée
    - lycee
    - lycéen
    - lyceen
  tertiary:
    - university
    - universities
    - college
    - campus
    - undergraduate
    - postgraduate
    - "graduate student"
    - professor
    - faculty
    - "student union"
    - tertiary
    - "higher education"
    - polytechnic
    - varsity
    - vice-chancellor
  # Sexual exploitation, abuse and harassment
  seah:
    - "sexual assault"
    - "sexual violence"
    - "sexual harassment"
    - "sexual abuse"
    - "sexual exploitation"
    - "sexual misconduct"
    - "gang rape"
    - rape
    - raped
    - rapist
    - "title ix"
    - seah
